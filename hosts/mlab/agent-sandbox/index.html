<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fdfbff; --surface-container: #f1f0f6; --surface-container-high: #e9e7ef;
    --on-surface: #1b1b21; --on-surface-variant: #46464f; --outline-variant: #c7c5d0;
    --primary: #3f5aa9; --on-primary: #fff; --primary-container: #dbe1ff; --on-primary-container: #00174b;
    --error: #ba1a1a; --success: #2b6c3f; --radius: 12px;
    --mono: ui-monospace, "Roboto Mono", "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #121318; --surface-container: #1e1f25; --surface-container-high: #292a2f;
      --on-surface: #e3e2e9; --on-surface-variant: #c7c5d0; --outline-variant: #46464f;
      --primary: #b4c5ff; --on-primary: #08286f; --primary-container: #264191; --on-primary-container: #dbe1ff;
      --error: #ffb4ab; --success: #8fd8a0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; display: grid; grid-template-columns: 248px minmax(0, 1fr); overflow: hidden;
    background: var(--surface); color: var(--on-surface); font: 14px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: transparent; color: var(--primary);
    font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color 0.15s;
  }
  button:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  button:disabled { opacity: 0.38; cursor: default; background: transparent; }
  button.filled { background: var(--primary); color: var(--on-primary); }
  button.filled:hover { background: color-mix(in srgb, var(--primary) 92%, var(--on-primary)); }
  button.tonal { background: var(--primary-container); color: var(--on-primary-container); }
  button.danger { color: var(--error); }
  button.danger:hover { background: color-mix(in srgb, var(--error) 8%, transparent); }
  button.icon { width: 40px; padding: 0; display: inline-grid; place-items: center; color: var(--on-surface-variant); }
  input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--outline-variant); background: transparent;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }

  aside {
    background: var(--surface-container); padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  }
  #new { display: flex; flex-direction: column; gap: 8px; }
  .project { display: flex; flex-direction: column; gap: 2px; }
  .project-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 0 12px; font-weight: 500; }
  .project-head > div { min-width: 0; }
  .project-head small { color: var(--on-surface-variant); font-weight: 400; display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-head button { height: 32px; padding: 0 12px; font-size: 13px; }
  .session { padding: 8px 12px; border-radius: 20px; cursor: pointer; min-height: 40px; }
  .session:hover { background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
  .session.active { background: var(--primary-container); color: var(--on-primary-container); }
  .session .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session small { display: flex; align-items: center; gap: 6px; color: var(--on-surface-variant); font-size: 12px; }
  .session small::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .state-working { color: var(--primary) !important; }
  .state-done { color: var(--success) !important; }
  .state-aborted { color: var(--error) !important; }

  main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px; min-height: 56px;
    border-bottom: 1px solid var(--outline-variant);
  }
  #title { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #actions { display: flex; gap: 4px; flex-wrap: wrap; }
  #actions[hidden] { display: none; }
  #menu { display: none; }

  #log {
    overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    overflow-wrap: anywhere;
  }
  #log > * { min-width: 0; max-width: 100%; }
  .msg { white-space: pre-wrap; line-height: 1.6; }
  .user {
    align-self: flex-end; background: var(--primary-container); color: var(--on-primary-container);
    padding: 10px 14px; border-radius: 18px 18px 4px 18px; max-width: min(80%, 640px);
  }
  details { border-radius: var(--radius); }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .tool { background: var(--surface-container); }
  .tool summary { padding: 8px 12px; font-family: var(--mono); font-size: 12.5px; }
  .tool pre {
    margin: 0; padding: 8px 12px 12px; max-height: 320px; overflow-y: auto; overflow-x: hidden;
    white-space: pre-wrap; font-family: var(--mono); font-size: 12px; color: var(--on-surface-variant);
  }
  .tool.error summary { color: var(--error); }
  .preview {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    color: var(--on-surface-variant); font-size: 12px; white-space: pre-wrap; margin-top: 4px;
  }
  .command { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .tool[open] .command { display: block; }
  .tool[open] .preview, .thinking[open] .preview { display: none; }
  .thinking { color: var(--on-surface-variant); border-left: 2px solid var(--outline-variant); border-radius: 0; padding-left: 12px; }
  .thinking summary { font-size: 12px; font-style: italic; }
  .thinking .msg { font-size: 13px; font-style: italic; margin-top: 4px; }
  .result { background: var(--surface-container); border-left: 4px solid var(--success); border-radius: var(--radius); padding: 12px 16px; }
  .result.aborted { border-left-color: var(--error); }
  .result h3 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
  .result pre {
    margin: 4px 0 8px; padding: 8px 12px; background: var(--surface-container-high); border-radius: 8px;
    white-space: pre-wrap; font-family: var(--mono); font-size: 12px;
  }
  .note { color: var(--on-surface-variant); font-size: 12px; }
  .note.error { color: var(--error); }

  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px 16px; }
  .composer textarea { resize: none; min-height: 44px; max-height: 40dvh; border-radius: 22px; padding: 11px 16px; line-height: 1.5; }
  .composer button { height: 44px; border-radius: 22px; }
  .scrim { display: none; }

  @media (max-width: 720px) {
    body { grid-template-columns: minmax(0, 1fr); }
    aside {
      position: fixed; inset: 0 auto 0 0; width: min(304px, 85vw); z-index: 2; transform: translateX(-100%);
      transition: transform 0.2s; box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
    }
    body.nav-open aside { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 1; background: rgb(0 0 0 / 0.32); }
    #menu { display: inline-grid; margin-left: -8px; }
    #title { flex-basis: calc(100% - 48px); }
    #actions { width: 100%; justify-content: space-between; margin: 0 -8px; width: calc(100% + 16px); }
    header { padding: 8px 12px; }
    #log { padding: 12px; }
    .composer { padding: 8px 12px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside aria-label="Projects">
  <form id="new">
    <input id="repo" placeholder="git@github.com:owner/repo" aria-label="Repository">
    <input id="project-id" placeholder="id (default: repo name)" aria-label="Project id" pattern="[a-z][a-z0-9]*(_[a-z0-9]+)*">
    <button class="tonal">Add project</button>
  </form>
  <div id="projects"></div>
</aside>
<div class="scrim" id="scrim"></div>
<main>
  <header>
    <button type="button" class="icon" id="menu" aria-label="Projects">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div id="title">Pick a project and start a task</div>
    <div id="actions" hidden>
      <button type="button" id="continue">Continue</button>
      <button type="button" id="abort">Abort</button>
      <button type="button" id="push">Push</button>
      <button type="button" class="danger" id="delete">Delete</button>
    </div>
  </header>
  <div id="log"></div>
  <form class="composer" id="send">
    <textarea id="message" rows="1" placeholder="Describe the task" aria-label="Prompt" required></textarea>
    <button class="filled" id="send-button">Send</button>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, draftProject = null, source = null, tools = new Map(), assistant = null, thinking = null;
let following = true, followFrame = 0, userScrollUntil = 0;
const lastState = new Map();

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

async function busy(button, action) {
  button.disabled = true;
  try { await action(); } catch (error) { alert(error.message); } finally { button.disabled = false; }
}

function stateOf(s) {
  if (s.running) return "working";
  if (s.result) return s.result.aborted ? "aborted" : "done";
  return "idle";
}

function notifyFinished(s) {
  const previous = lastState.get(s.id);
  const state = stateOf(s);
  lastState.set(s.id, state);
  if (previous === undefined || previous === state || !s.result) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const notification = new Notification(`${s.id} ${state}`, { body: s.result.summary.slice(-300) || s.title, tag: s.id });
  notification.onclick = () => { window.focus(); open(s.id); };
}

async function refresh() {
  const [projects, list] = await Promise.all([api("/api/projects"), api("/api/sessions")]);
  list.forEach(notifyFinished);
  $("projects").replaceChildren(...projects.map((p) => {
    const box = document.createElement("div");
    box.className = "project";
    const head = document.createElement("div");
    head.className = "project-head";
    const label = document.createElement("div");
    label.textContent = p.id;
    const repo = document.createElement("small");
    repo.textContent = p.repo || "empty repo";
    label.append(repo);
    const add = document.createElement("button");
    add.textContent = "+ task";
    add.onclick = () => startDraft(p.id);
    head.append(label, add);
    box.append(head);
    for (const s of list.filter((s) => s.project === p.id)) {
      const el = document.createElement("div");
      el.className = "session" + (s.id === current ? " active" : "");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = s.title;
      const state = document.createElement("small");
      state.textContent = `${s.id} · ${stateOf(s)}`;
      state.className = `state-${stateOf(s)}`;
      el.append(title, state);
      el.title = s.branch;
      el.onclick = () => open(s.id);
      box.append(el);
    }
    return box;
  }));
  const active = list.find((s) => s.id === current);
  if (active) $("title").textContent = `${active.id} · ${active.branch} · ${stateOf(active)}`;
  $("continue").disabled = !active || active.running;
  $("actions").hidden = !active;
}

function projectOf(sessionId) {
  return sessionId.replace(/_\d+$/, "");
}

function navigate(path, push) {
  if (push && location.pathname !== path) history.pushState(null, "", path);
}

function route() {
  const [project, task] = decodeURIComponent(location.pathname).split("/").filter(Boolean);
  if (task) open(task, false);
  else if (project) startDraft(project, false);
  else showHome(false);
}

function showHome(push = true) {
  navigate("/", push);
  current = null; draftProject = null;
  if (source) source.close();
  source = null;
  $("log").replaceChildren();
  $("title").textContent = "Pick a project and start a task";
  $("send-button").textContent = "Send";
  refresh();
}

function startDraft(projectId, push = true) {
  navigate(`/${projectId}`, push);
  current = null; draftProject = projectId;
  if (source) source.close();
  source = null;
  $("log").replaceChildren();
  $("title").textContent = `New task in ${projectId}`;
  document.body.classList.remove("nav-open");
  $("send-button").textContent = "Start task";
  $("message").focus();
  refresh();
}

function open(id, push = true) {
  navigate(`/${projectOf(id)}/${id}`, push);
  current = id; draftProject = null; following = true;
  if (source) source.close();
  $("log").replaceChildren();
  $("send-button").textContent = "Send";
  document.body.classList.remove("nav-open");
  tools = new Map(); assistant = null; thinking = null;
  source = new EventSource(`/api/sessions/${id}/events`);
  source.onmessage = (event) => render(JSON.parse(event.data));
  refresh();
}

function add(el) {
  $("log").append(el);
}

function follow() {
  if (!following || followFrame) return;
  followFrame = requestAnimationFrame(() => {
    followFrame = 0;
    $("log").scrollTop = $("log").scrollHeight;
  });
}

for (const type of ["wheel", "touchmove", "pointerdown", "keydown"]) {
  $("log").addEventListener(type, () => { userScrollUntil = performance.now() + 1000; }, { passive: true });
}

$("log").addEventListener("scroll", () => {
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  if (atBottom) following = true;
  else if (performance.now() < userScrollUntil) following = false;
});

function text(result) {
  return (result?.content || []).map((c) => c.text || "").join("");
}

function firstLine(value) {
  const line = value.trim().split("\n")[0];
  return line.length > 140 ? line.slice(0, 140) + "..." : line;
}

function lastLines(value, count) {
  return value.trimEnd().split("\n").filter((line) => line.trim()).slice(-count).join("\n");
}

function thinkingBlock() {
  const el = document.createElement("details");
  el.className = "thinking"; el.open = true;
  const summary = document.createElement("summary");
  summary.textContent = "thinking";
  const preview = document.createElement("span");
  preview.className = "preview";
  summary.append(preview);
  const body = document.createElement("div");
  body.className = "msg";
  el.append(summary, body);
  return { el, body, preview };
}

function resultCard(record) {
  const el = document.createElement("div");
  el.className = "result" + (record.aborted ? " aborted" : "");
  const heading = document.createElement("h3");
  heading.textContent = record.aborted ? "Aborted" : "Finished";
  el.append(heading);
  for (const [label, value] of [["Commits", record.commits], ["Changes", record.diffstat], ["Uncommitted", record.uncommitted]]) {
    if (!value) continue;
    const name = document.createElement("div");
    name.className = "note"; name.textContent = label;
    const pre = document.createElement("pre");
    pre.textContent = value;
    el.append(name, pre);
  }
  if (!record.commits && !record.diffstat && !record.uncommitted) {
    const none = document.createElement("div");
    none.className = "note"; none.textContent = "No changes on the branch";
    el.append(none);
  }
  return el;
}

function note(message, isError = false) {
  const el = document.createElement("div");
  el.className = "note" + (isError ? " error" : "");
  el.textContent = message;
  add(el);
}

function render(record) {
  renderRecord(record);
  follow();
}

function renderRecord(record) {
  switch (record.type) {
    case "user_prompt": {
      const el = document.createElement("div");
      el.className = "msg user"; el.textContent = record.message;
      assistant = null; add(el); break;
    }
    case "message_update": {
      const delta = record.assistantMessageEvent;
      if (delta?.type === "thinking_start") { thinking = thinkingBlock(); assistant = null; add(thinking.el); break; }
      if (delta?.type === "thinking_delta" && thinking) { thinking.body.textContent += delta.delta; break; }
      if (delta?.type === "thinking_end" && thinking) {
        thinking.el.open = false;
        thinking.preview.textContent = firstLine(thinking.body.textContent);
        thinking = null; break;
      }
      if (delta?.type !== "text_delta") break;
      if (!assistant) { assistant = document.createElement("div"); assistant.className = "msg"; add(assistant); }
      assistant.textContent += delta.delta; break;
    }
    case "message_end":
      if (record.message?.role !== "assistant") break;
      assistant = null; thinking = null;
      if (record.message.stopReason === "error") note(`model error: ${record.message.errorMessage || "unknown"}`, true);
      break;
    case "auto_retry_start":
      note(`retrying in ${Math.round(record.delayMs / 1000)}s (attempt ${record.attempt} of ${record.maxAttempts}) after: ${record.errorMessage}`, true); break;
    case "auto_retry_end":
      if (!record.success) note(`gave up after ${record.attempt} attempts: ${record.finalError}`, true); break;
    case "compaction_start":
      note(`compacting context (${record.reason})`); break;
    case "compaction_end":
      note("context compacted"); break;
    case "response":
      if (record.success === false) note(`${record.command} failed: ${record.error}`, true); break;
    case "tool_execution_start": {
      const el = document.createElement("details");
      el.className = "tool"; el.open = true;
      const summary = document.createElement("summary");
      const command = document.createElement("span");
      command.className = "command";
      command.textContent = `${record.toolName} ${record.args?.command || JSON.stringify(record.args)}`;
      summary.append(command);
      const preview = document.createElement("span");
      preview.className = "preview";
      summary.append(preview);
      const out = document.createElement("pre");
      el.append(summary, out); tools.set(record.toolCallId, { el, out, preview });
      assistant = null; add(el); break;
    }
    case "tool_execution_update": {
      const tool = tools.get(record.toolCallId);
      if (tool) tool.out.textContent = text(record.partialResult); break;
    }
    case "tool_execution_end": {
      const tool = tools.get(record.toolCallId);
      if (!tool) break;
      tool.out.textContent = text(record.result);
      tool.el.open = false;
      tool.preview.textContent = lastLines(tool.out.textContent, 3);
      if (record.isError) tool.el.classList.add("error"); break;
    }
    case "session_result":
      assistant = null; add(resultCard(record)); refresh(); break;
    case "bridge_push": {
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = `pushed ${record.text}`;
      add(el); break;
    }
    case "bridge_exit": case "bridge_stderr": {
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = record.type === "bridge_exit" && record.code === null
        ? "agent was stopped, press Continue to resume"
        : `${record.type}: ${record.text ?? record.code}`;
      add(el); refresh(); break;
    }
  }
}

$("new").onsubmit = (event) => {
  event.preventDefault();
  busy(event.submitter, async () => {
    const project = await api("/api/projects", { method: "POST", body: JSON.stringify({ repo: $("repo").value, id: $("project-id").value }) });
    $("repo").value = ""; $("project-id").value = "";
    startDraft(project.id);
  });
};

$("send").onsubmit = (event) => {
  event.preventDefault();
  if (!current && !draftProject) return alert("Pick a project or a task first");
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  const message = $("message").value;
  busy(event.submitter, async () => {
    if (current) {
      await api(`/api/sessions/${current}/prompt`, { method: "POST", body: JSON.stringify({ message }) });
    } else {
      const session = await api(`/api/projects/${draftProject}/sessions`, { method: "POST", body: JSON.stringify({ message }) });
      lastState.set(session.id, "idle");
      open(session.id);
    }
    $("message").value = "";
    $("message").oninput();
  });
};

$("menu").onclick = () => document.body.classList.toggle("nav-open");
$("scrim").onclick = () => document.body.classList.remove("nav-open");

$("message").oninput = () => {
  $("message").style.height = "auto";
  $("message").style.height = `${$("message").scrollHeight + 2}px`;
};

$("message").onkeydown = (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) $("send").requestSubmit();
};

$("abort").onclick = () => current && api(`/api/sessions/${current}/abort`, { method: "POST" });

$("continue").onclick = (event) => {
  if (!current) return;
  busy(event.currentTarget, () => api(`/api/sessions/${current}/continue`, { method: "POST" }));
};

$("push").onclick = (event) => {
  if (!current) return;
  busy(event.currentTarget, () => api(`/api/sessions/${current}/push`, { method: "POST" }));
};

$("delete").onclick = (event) => {
  if (!current || !confirm(`Delete task ${current}, its worktree and its branch agent/${current}?`)) return;
  busy(event.currentTarget, async () => {
    await api(`/api/sessions/${current}`, { method: "DELETE" });
    showHome();
  });
};

window.addEventListener("popstate", route);
route();
setInterval(refresh, 5000);
</script>
</body>
</html>

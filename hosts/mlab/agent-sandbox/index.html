<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1c1c1e; --muted: #6b6b70; --line: #d8d8de; --card: #f4f4f7; --accent: #2f6fed; --err: #c43b3b; --ok: #2e8b57; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151518; --fg: #e6e6ea; --muted: #9a9aa2; --line: #2e2e34; --card: #1e1e23; --accent: #6b9bff; --err: #ff7b7b; --ok: #5fd08f; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: grid; grid-template-columns: 260px 1fr; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  aside { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); min-height: 42px; }
  #log { overflow-y: auto; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .project { margin-top: 8px; }
  .project-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .project-head button { padding: 2px 8px; font-size: 12px; }
  .project-head small { color: var(--muted); font-weight: 400; display: block; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .session { padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .session.active { border-color: var(--accent); }
  .session .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session small { color: var(--muted); display: block; font-family: ui-monospace, monospace; font-size: 11px; }
  .state-working { color: var(--accent) !important; }
  .state-done { color: var(--ok) !important; }
  .state-aborted { color: var(--err) !important; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  .tool { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .tool summary { padding: 6px 10px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 13px; }
  .tool pre { margin: 0; padding: 8px 10px; overflow-x: auto; max-height: 320px; border-top: 1px solid var(--line); font-size: 12px; }
  .tool.error summary { color: var(--err); }
  .preview { display: block; color: var(--muted); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .thinking { color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
  .thinking summary { cursor: pointer; font-size: 12px; font-style: italic; }
  .thinking .msg { font-size: 13px; font-style: italic; margin-top: 4px; }
  .result { border: 1px solid var(--ok); border-radius: 8px; padding: 10px 12px; }
  .result.aborted { border-color: var(--err); }
  .result h3 { margin: 0 0 6px; font-size: 14px; }
  .result pre { margin: 6px 0 0; padding: 8px; background: var(--card); border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; }
  form.send { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: inherit; font: inherit; }
  button, input { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: inherit; }
  button:disabled { opacity: 0.5; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 640px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 35dvh; } }
</style>
</head>
<body>
<aside>
  <form id="new" style="display:flex;flex-direction:column;gap:6px">
    <input id="repo" placeholder="git@github.com:owner/repo">
    <input id="project-id" placeholder="id (default: repo name)" pattern="[a-z][a-z0-9]*(_[a-z0-9]+)*">
    <button class="primary">Add project</button>
  </form>
  <div id="projects"></div>
</aside>
<main>
  <header id="title">Pick a project and start a task</header>
  <div id="log"></div>
  <form class="send" id="send">
    <textarea id="message" placeholder="Prompt" required></textarea>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="primary" id="send-button">Send</button>
      <button type="button" id="abort">Abort</button>
      <button type="button" id="push">Push</button>
      <button type="button" id="delete">Delete</button>
    </div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, draftProject = null, source = null, tools = new Map(), assistant = null, thinking = null;
const lastState = new Map();

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

async function busy(button, action) {
  button.disabled = true;
  try { await action(); } catch (error) { alert(error.message); } finally { button.disabled = false; }
}

function stateOf(s) {
  if (s.running) return "working";
  if (s.result) return s.result.aborted ? "aborted" : "done";
  return "idle";
}

function notifyFinished(s) {
  const previous = lastState.get(s.id);
  const state = stateOf(s);
  lastState.set(s.id, state);
  if (previous === undefined || previous === state || !s.result) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const notification = new Notification(`${s.id} ${state}`, { body: s.result.summary.slice(-300) || s.title, tag: s.id });
  notification.onclick = () => { window.focus(); open(s.id); };
}

async function refresh() {
  const [projects, list] = await Promise.all([api("/api/projects"), api("/api/sessions")]);
  list.forEach(notifyFinished);
  $("projects").replaceChildren(...projects.map((p) => {
    const box = document.createElement("div");
    box.className = "project";
    const head = document.createElement("div");
    head.className = "project-head";
    const label = document.createElement("div");
    label.textContent = p.id;
    const repo = document.createElement("small");
    repo.textContent = p.repo || "empty repo";
    label.append(repo);
    const add = document.createElement("button");
    add.textContent = "+ task";
    add.onclick = () => startDraft(p.id);
    head.append(label, add);
    box.append(head);
    for (const s of list.filter((s) => s.project === p.id)) {
      const el = document.createElement("div");
      el.className = "session" + (s.id === current ? " active" : "");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = s.title;
      const state = document.createElement("small");
      state.textContent = `${s.id} · ${stateOf(s)}`;
      state.className = `state-${stateOf(s)}`;
      el.append(title, state);
      el.title = s.branch;
      el.onclick = () => open(s.id);
      box.append(el);
    }
    return box;
  }));
  const active = list.find((s) => s.id === current);
  if (active) $("title").textContent = `${active.id} · ${active.branch} · ${stateOf(active)}`;
}

function startDraft(projectId) {
  current = null; draftProject = projectId;
  if (source) source.close();
  source = null;
  $("log").replaceChildren();
  $("title").textContent = `New task in ${projectId} (runs on its own branch and worktree)`;
  $("send-button").textContent = "Start task";
  $("message").focus();
  refresh();
}

function open(id) {
  current = id; draftProject = null;
  if (source) source.close();
  $("log").replaceChildren();
  $("send-button").textContent = "Send";
  tools = new Map(); assistant = null; thinking = null;
  source = new EventSource(`/api/sessions/${id}/events`);
  source.onmessage = (event) => render(JSON.parse(event.data));
  refresh();
}

function add(el) {
  const log = $("log");
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  log.append(el);
  if (stick) log.scrollTop = log.scrollHeight;
}

function text(result) {
  return (result?.content || []).map((c) => c.text || "").join("");
}

function firstLine(value) {
  const line = value.trim().split("\n")[0];
  return line.length > 140 ? line.slice(0, 140) + "..." : line;
}

function lastLines(value, count) {
  return value.trimEnd().split("\n").filter((line) => line.trim()).slice(-count).join("\n");
}

function thinkingBlock() {
  const el = document.createElement("details");
  el.className = "thinking"; el.open = true;
  const summary = document.createElement("summary");
  summary.textContent = "thinking";
  const preview = document.createElement("span");
  preview.className = "preview";
  summary.append(preview);
  const body = document.createElement("div");
  body.className = "msg";
  el.append(summary, body);
  return { el, body, preview };
}

function resultCard(record) {
  const el = document.createElement("div");
  el.className = "result" + (record.aborted ? " aborted" : "");
  const heading = document.createElement("h3");
  heading.textContent = record.aborted ? "Aborted" : "Finished";
  el.append(heading);
  for (const [label, value] of [["Commits", record.commits], ["Changes", record.diffstat], ["Uncommitted", record.uncommitted]]) {
    if (!value) continue;
    const name = document.createElement("div");
    name.className = "note"; name.textContent = label;
    const pre = document.createElement("pre");
    pre.textContent = value;
    el.append(name, pre);
  }
  if (!record.commits && !record.diffstat && !record.uncommitted) {
    const none = document.createElement("div");
    none.className = "note"; none.textContent = "No changes on the branch";
    el.append(none);
  }
  return el;
}

function render(record) {
  switch (record.type) {
    case "user_prompt": {
      const el = document.createElement("div");
      el.className = "msg user"; el.textContent = record.message;
      assistant = null; add(el); break;
    }
    case "message_update": {
      const delta = record.assistantMessageEvent;
      if (delta?.type === "thinking_start") { thinking = thinkingBlock(); assistant = null; add(thinking.el); break; }
      if (delta?.type === "thinking_delta" && thinking) { thinking.body.textContent += delta.delta; break; }
      if (delta?.type === "thinking_end" && thinking) {
        thinking.el.open = false;
        thinking.preview.textContent = firstLine(thinking.body.textContent);
        thinking = null; break;
      }
      if (delta?.type !== "text_delta") break;
      if (!assistant) { assistant = document.createElement("div"); assistant.className = "msg"; add(assistant); }
      assistant.textContent += delta.delta; break;
    }
    case "message_end":
      if (record.message?.role === "assistant") { assistant = null; thinking = null; } break;
    case "tool_execution_start": {
      const el = document.createElement("details");
      el.className = "tool"; el.open = true;
      const summary = document.createElement("summary");
      summary.textContent = `${record.toolName} ${record.args?.command || JSON.stringify(record.args)}`;
      const preview = document.createElement("span");
      preview.className = "preview";
      summary.append(preview);
      const out = document.createElement("pre");
      el.append(summary, out); tools.set(record.toolCallId, { el, out, preview });
      assistant = null; add(el); break;
    }
    case "tool_execution_update": {
      const tool = tools.get(record.toolCallId);
      if (tool) tool.out.textContent = text(record.partialResult); break;
    }
    case "tool_execution_end": {
      const tool = tools.get(record.toolCallId);
      if (!tool) break;
      tool.out.textContent = text(record.result);
      tool.el.open = false;
      tool.preview.textContent = lastLines(tool.out.textContent, 3);
      if (record.isError) tool.el.classList.add("error"); break;
    }
    case "session_result":
      assistant = null; add(resultCard(record)); refresh(); break;
    case "bridge_push": {
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = `pushed ${record.text}`;
      add(el); break;
    }
    case "bridge_exit": case "bridge_stderr": {
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = `${record.type}: ${record.text ?? record.code}`;
      add(el); refresh(); break;
    }
  }
}

$("new").onsubmit = (event) => {
  event.preventDefault();
  busy(event.submitter, async () => {
    const project = await api("/api/projects", { method: "POST", body: JSON.stringify({ repo: $("repo").value, id: $("project-id").value }) });
    $("repo").value = ""; $("project-id").value = "";
    startDraft(project.id);
  });
};

$("send").onsubmit = (event) => {
  event.preventDefault();
  if (!current && !draftProject) return alert("Pick a project or a task first");
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  const message = $("message").value;
  busy(event.submitter, async () => {
    if (current) {
      await api(`/api/sessions/${current}/prompt`, { method: "POST", body: JSON.stringify({ message }) });
    } else {
      const session = await api(`/api/projects/${draftProject}/sessions`, { method: "POST", body: JSON.stringify({ message }) });
      lastState.set(session.id, "idle");
      open(session.id);
    }
    $("message").value = "";
  });
};

$("message").onkeydown = (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) $("send").requestSubmit();
};

$("abort").onclick = () => current && api(`/api/sessions/${current}/abort`, { method: "POST" });

$("push").onclick = (event) => {
  if (!current) return;
  busy(event.currentTarget, () => api(`/api/sessions/${current}/push`, { method: "POST" }));
};

$("delete").onclick = (event) => {
  if (!current || !confirm(`Delete task ${current}, its worktree and its branch agent/${current}?`)) return;
  busy(event.currentTarget, async () => {
    await api(`/api/sessions/${current}`, { method: "DELETE" });
    if (source) source.close();
    source = null; current = null;
    $("log").replaceChildren();
    $("title").textContent = "Pick a project and start a task";
    await refresh();
  });
};

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
